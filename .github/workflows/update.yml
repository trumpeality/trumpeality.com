name: Update Trumpeality Site

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch sheet data and build site
        run: node build.js

      - name: Commit changes
        run: |
          git config user.name "trumpeality-bot"
          git config user.email "bot@trumpeality.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Update site with latest tweets"
          git push
